# Streamlit Community Cloud duerme la app tras un tiempo sin visitas, y un commit no la despierta (26-oct-2026).
# Un navegador sin pantalla abre la app y, si esta dormida, oprime «Yes, get this app back up!»
# (scripts_experimento/visitar_app.py). Cada hora desde el 6-nov-2026: con cada 6 h, el retraso de GitHub dejaba
# huecos de 12 a 16 h entre visitas.
name: Mantener despierta la app

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Abrir la app
        run: python scripts_experimento/visitar_app.py
