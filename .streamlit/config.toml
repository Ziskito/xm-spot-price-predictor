# Tema base del dashboard del motor de decision. El dashboard tiene su propio
# interruptor claro/oscuro (barra lateral, dashboard/app.py, diccionario TEMAS)
# que repinta toda la interfaz con CSS; este tema claro es solo el punto de
# partida y fija que no dependa de la preferencia del navegador.
[theme]
base = "light"
primaryColor = "#15803D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[browser]
gatherUsageStats = false
